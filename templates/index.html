<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot NBA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 450px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #1d428a;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }


        .header span {
            color: #c9082a;
        }

        .chat-box {
            height: 420px;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fafafa;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.4;
            font-size: 16px;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #d1e7dd;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid #badbcc;
            color: #0f5132;
        }

        .bot-msg {
            background-color: #e2e3e5;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #d3d6d8;
            color: #41464b;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background-color: #fff;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }

        .input-area input:focus {
            border-color: #1d428a;
        }

        .input-area button {
            background-color: #1d428a;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-area button:hover {
            background-color: #c9082a;
        }

        .fonte-badge {
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.65;
            align-self: flex-start;
        }

        .fonte-base  { color: #1d428a; }
        .fonte-padrao { color: #888; }
        .fonte-llm { color: #c9082a; }

        .typing {
            opacity: 0.7;
            font-style: italic;
        }

        .typing::after {
            content: "";
            animation: pontos 1.2s steps(4, end) infinite;
        }

        @keyframes pontos {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
            100% { content: ""; }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">Chatbot <span>NBA 🏀</span></div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-msg">Fala aí! Sou o Bot da NBA. Me lança uma pergunta sobre algum time (Lakers, Celtics), jogador (LeBron, Curry, Jordan) ou regras do jogo!</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Pergunte aqui..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            var inputField = document.getElementById("user-input");
            var message = inputField.value;
            
            if(message.trim() === "") {
                return;
            }


            var chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += '<div class="message user-msg">' + message + '</div>';
            

            inputField.value = "";


            chatBox.scrollTop = chatBox.scrollHeight;


            var formData = new FormData();
            formData.append("msg", message);

            // Mostra o "pensando" IMEDIATAMENTE, enquanto a requisição roda
            // (a LLM pode levar alguns segundos pra gerar a resposta).
            var digitandoMsg = document.createElement("div");
            digitandoMsg.className = "message bot-msg typing";
            digitandoMsg.innerText = "🏀 Bot da NBA está pensando";
            chatBox.appendChild(digitandoMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            fetch("/chat", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {

                // Troca o indicador pela resposta real.
                digitandoMsg.classList.remove("typing");
                digitandoMsg.innerText = data.response;

                var fontes = {
                    "base":   { classe: "fonte-base",   texto: "🗂️ Base de dados" },
                    "llm":    { classe: "fonte-llm",    texto: "🧠 IA (LLM Hugging Face)" },
                    "padrao": { classe: "fonte-padrao", texto: "🤖 Resposta padrão" }
                };

                var info = fontes[data.fonte] || fontes["padrao"];

                var badge = document.createElement("div");
                badge.className = "fonte-badge " + info.classe;
                badge.innerText = info.texto + "  ·  🌍 " + data.idioma;
                chatBox.appendChild(badge);

                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                console.error("Erro:", error);
                digitandoMsg.classList.remove("typing");
                digitandoMsg.innerText = "Ops, deu erro no servidor. Ligou o Flask lá no terminal?";
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
